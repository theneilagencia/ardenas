                  - draft
                  - active
                  - paused
                  - archived
        - name: search
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                maxLength: 200
        - name: ownerId
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
        - name: authorityLevel
          in: query
          required: false
