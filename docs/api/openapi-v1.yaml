        '503':
          description: Erro padronizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      security:
        - bearerAuth: []
      x-permission: null
      x-idempotent: false
      x-optimistic-concurrency: false
      description: O servidor deriva usuário, organização ativa e permissões da sessão autenticada. O cliente não envia permissões.
