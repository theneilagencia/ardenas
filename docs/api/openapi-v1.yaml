# Arden.AS — OpenAPI v1 (ARDEN-FE-003)
# GERADO a partir de src/contracts (fonte única). Não editar à mão.
# Regenerar: npm run contracts:openapi
openapi: 3.0.3
info:
  title: Arden.AS API
  version: 1.0.0
  description: >-
    Contratos definitivos da API v1 do Arden.AS (ARDEN-FE-003). Sem backend nesta issue — apenas o contrato
    compartilhado por frontend e futuro backend. O backend é a fonte de verdade: deriva usuário, organização e
    permissões da sessão; o cliente não envia permissões nem escolhe o tenant arbitrariamente.
servers:
  - url: /api/v1
    description: API v1
security:
  - bearerAuth: []
tags:
  - name: Session
    description: Identidade e sessão. O servidor deriva usuário/org/permissões.
  - name: Operations
    description: Operações (org-scoped).
  - name: OperationVersions
    description: Versões de operação; publicada é imutável.
  - name: Authority
    description: Gradiente de Autoridade da versão.
  - name: Audit
    description: Trilha de auditoria (somente leitura).
  - name: Policies
    description: Políticas de governança versionadas e vínculos.
  - name: Approvals
    description: Fluxos, solicitações, decisões e delegações de aprovação.
  - name: Enforcement
    description: Avaliação de ações e autorizações de ação.
  - name: Executions
    description: Execuções assíncronas, etapas, eventos e evidências.
  - name: Connectors
    description: Conectores, conexões, credenciais, ferramentas externas e webhooks (contratado — ARDEN-BE-006).
  - name: Agents
    description: >-
      Runtime de agentes: agentes, versões, providers e configurações de modelo (contratado — ARDEN-BE-007). Sem
      execução direta; execução via etapa agent.execute.
paths:
  /session:
    get:
      operationId: session.get
      summary: Sessão atual (usuário, organizações, memberships, org ativa, permissões, expiração, status).
      tags:
        - Session
      parameters:
        - name: X-Correlation-Id
          in: header
          required: false
          description: Rastreio fim a fim. O servidor gera quando ausente e ecoa na resposta.
          schema:
            type: string
      responses:
