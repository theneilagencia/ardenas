            anyOf:
              - not: {}
              - type: integer
                minimum: 1
                maximum: 5
        - name: createdAfter
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
              - type: string
                format: date-time
                description: ISO 8601 date-time in UTC (Z suffix)
            description: ISO 8601 date-time in UTC (Z suffix)
        - name: createdBefore
          in: query
          required: false
          schema:
            anyOf:
              - not: {}
