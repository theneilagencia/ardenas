name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend (typecheck, lint, test, build, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit + a11y)
        run: npm run test

      - name: Build
        run: npm run build

      - name: OpenAPI generation is in sync
        run: |
          npm run contracts:openapi
          git diff --exit-code docs/api/openapi-v1.yaml

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

  backend:
    name: Backend (typecheck, lint, tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arden_test?schema=public
      APP_VERSION: 0.1.0-ci
      # CORS_ORIGINS NÃO é fixado aqui: os testes de integração definem o valor
      # esperado (`http://allowed.test`) via test/setup-env.ts. Fixá-lo no job
      # sobrescreveria esse default e quebraria o teste de allowlist de CORS.
      # Identidade em CI usa SEMPRE o provider fake — nunca credenciais reais do
      # Supabase. A validação de config proíbe o provider fake em production.
      AUTH_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared contracts
        run: npm -w @arden/contracts run build

      - name: Prisma generate
        run: npm run db:generate

      - name: Apply migrations (deploy)
        run: npm run db:migrate:deploy

      - name: Migration status
        run: npm run db:migrate:status

      - name: Seed identity catalog (idempotent)
        run: |
          npm run db:seed
          npm run db:seed

      - name: Bootstrap organization (dry-run smoke)
        run: npm run bootstrap:organization -- --name "CI Org" --slug ci-org --user-subject ci-subject --provider fake --dry-run

      - name: Typecheck (api)
        run: npm run typecheck:api

      - name: Lint (api)
        run: npm run lint:api

      - name: Unit tests (api)
        run: npm run test:api

      - name: Integration tests (api)
        run: npm run test:api:integration

      - name: Build (api)
        run: npm run build:api

  e2e-api:
    name: E2E frontend↔backend (modo api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arden_test?schema=public
      AUTH_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared contracts
        run: npm -w @arden/contracts run build

      - name: Prisma generate
        run: npm run db:generate

      - name: Build (api)
        run: npm run build:api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (api mode — session + organizations)
        run: npm run test:e2e:api

  secrets:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::committed .env file found"; exit 1
          fi
          echo "no committed .env files"

      - name: No obvious hardcoded secrets
        run: |
          if git grep -nE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]+)' -- . ':(exclude).github/workflows/*'; then
            echo "::error::possible secret found"; exit 1
          fi
          echo "no obvious secrets"
