# ARDEN-PRD-001.2A.2 — Contrato do ambiente staging (isolado, provider-neutro).
environment: staging
isolation:
  projectOrAccount: isolated
  network: isolated
  database: isolated
  secrets: isolated
  domain: isolated
  logs: isolated
  identities: isolated
  budget: isolated
forbidden:
  - staging aponta para banco de outro ambiente
  - staging usa secrets de outro ambiente
  - staging consome fila de outro ambiente
